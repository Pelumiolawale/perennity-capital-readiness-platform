<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perennity — Capital Readiness Platform</title>
    <meta name="description" content="Assess your data center's readiness for sustainable capital. Evaluate sustainability alignment against EU Taxonomy, SFDR, and UK SDR frameworks." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B6B4A'/%3E%3Cpath d='M16 6l6 4v6c0 4-6 8-6 8s-6-4-6-8v-6l6-4z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      // Minimal `process` global shim. fast-glob (transitively bundled via
      // @perennity/engine) reads process.emit / process.versions.node /
      // process.nextTick / process.cwd / process.version at module init; the
      // browser has no `process` global so module init throws and React never
      // mounts. Classic <script> in <head> runs synchronously before the
      // deferred type="module" entry below, so the global is in place by the
      // time the bundle's module-init code executes.
      window.process = window.process || {
        env: {},
        platform: 'browser',
        version: '',
        versions: { node: '0.0.0' },
        cwd: function () { return '/'; },
        nextTick: function (cb) { queueMicrotask(cb); },
        emit: function () { return false; },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
